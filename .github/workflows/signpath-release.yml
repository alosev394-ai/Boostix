name: Boostix signed release build

# Builds a release on GitHub-hosted Windows and has SignPath sign it with the
# SignPath Foundation certificate. Each file is signed before it goes inside
# the next one: the app, then the installer around it, then the update bridge
# around the installer. Runs only by hand and only once SignPath is set up
# (see CODE_SIGNING.md). The signed files come back as a workflow artifact;
# the update manifest is still signed on the maintainer's PC.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: boostix-signpath-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and sign with SignPath
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_TOKEN_PRESENT: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Check the SignPath setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          if ($env:SIGNPATH_TOKEN_PRESENT -ne 'true') {
            $missing += 'secret SIGNPATH_API_TOKEN'
          }
          foreach ($name in @(
              'SIGNPATH_ORGANIZATION_ID',
              'SIGNPATH_PROJECT_SLUG',
              'SIGNPATH_SIGNING_POLICY_SLUG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += "variable $name"
            }
          }
          if ($missing.Count -gt 0) {
            throw ('SignPath is not set up for this repository yet. Missing: ' +
              ($missing -join ', ') + '. See CODE_SIGNING.md.')
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the app
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build.ps1 -Stage App
          if ($LASTEXITCODE -ne 0) {
            throw "App stage failed with exit code $LASTEXITCODE."
          }

      - name: Upload the unsigned app
        id: unsigned-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boostix-app-unsigned
          path: work/Boostix.exe
          if-no-files-found: error
          retention-days: 3

      - name: Sign the app
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: boostix-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/app

      - name: Build the installer around the signed app
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build.ps1 -Stage Setup -SignedAppPath signed\app\Boostix.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Setup stage failed with exit code $LASTEXITCODE."
          }

      - name: Upload the unsigned installer
        id: unsigned-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boostix-setup-unsigned
          path: work/Boostix-Setup-*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Sign the installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: boostix-setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/setup

      - name: Build the update bridge around the signed installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem -LiteralPath signed\setup -Filter 'Boostix-Setup-*.exe')
          if ($setup.Count -ne 1) {
            throw "Expected one signed installer, found $($setup.Count)."
          }
          & .\build.ps1 -Stage Bridge `
            -SignedAppPath signed\app\Boostix.exe `
            -SignedSetupPath $setup[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Bridge stage failed with exit code $LASTEXITCODE."
          }

      - name: Upload the unsigned update bridge
        id: unsigned-bridge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boostix-bridge-unsigned
          path: work/MajesticBoost-Setup-*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Sign the update bridge
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: boostix-bridge
          github-artifact-id: ${{ steps.unsigned-bridge.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/bridge

      - name: Put the signed files into dist
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem -LiteralPath signed\setup -Filter 'Boostix-Setup-*.exe')
          $bridge = @(Get-ChildItem -LiteralPath signed\bridge -Filter 'MajesticBoost-Setup-*.exe')
          if ($setup.Count -ne 1 -or $bridge.Count -ne 1) {
            throw 'Expected one signed installer and one signed bridge.'
          }
          & .\build.ps1 -Stage Release `
            -SignedAppPath signed\app\Boostix.exe `
            -SignedSetupPath $setup[0].FullName `
            -SignedBridgePath $bridge[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Release stage failed with exit code $LASTEXITCODE."
          }
          foreach ($file in Get-ChildItem -LiteralPath dist -Filter '*.exe') {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host ('{0}: {1} {2}' -f $file.Name, $signature.Status,
              $(if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { '' }))
          }

      - name: Upload the signed release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boostix-signed-release
          path: |
            dist/Boostix.exe
            dist/Boostix-Setup-*.exe
            dist/MajesticBoost-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
